name: 💡 Feature request
description: Suggest an idea or a new vendor/command
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "When I troubleshoot OSPF on Juniper, I have to ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: input
    id: vendor
    attributes:
      label: Vendor / platform (if relevant)
